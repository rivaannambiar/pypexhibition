<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roughbook Clipper Settings</title><style>body{font:15px/1.5 system-ui,sans-serif;background:#0b0e15;color:#edf2fb;max-width:650px;margin:50px auto;padding:24px}section{border:1px solid #283041;border-radius:16px;padding:23px;background:#131925}label{display:block;font-weight:650;font-size:13px;margin:20px 0 7px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #394255;background:#090d14;color:#fff}button{margin-top:15px;border:0;border-radius:9px;padding:11px 15px;background:#a9f06a;color:#10150d;font-weight:750;cursor:pointer}.muted{color:#9ba8bd;font-size:12px}#status{font-size:12px;margin-top:10px}</style></head><body><section><h1>Roughbook Clipper</h1><p class="muted">Choose your deployed Exhibition Workspace URL. The extension adds a right-click option when you select text on a webpage.</p><form id="form"><label for="appUrl">Workspace URL</label><input id="appUrl" type="url" placeholder="https://your-project.pages.dev" required><button>Save settings</button><div id="status" role="status"></div></form></section><script src="options.js"></script></body></html>
